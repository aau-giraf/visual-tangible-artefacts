services:
  postgres:
    image: postgres:16
    container_name: vta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vta_dev
      POSTGRES_USER: vta_user
      POSTGRES_PASSWORD: vta_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vta_user -d vta_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: VTA.API/Dockerfile
    container_name: vta-backend
    restart: unless-stopped
    ports:
      - "5192:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=vta_dev;Username=vta_user;Password=vta_password
      - Secret__SecretKey=your-secret-key-change-this-in-production-minimum-32-characters-long
      - AUTO_CREATE_DATABASE=true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_assets:/app/Assets
    networks:
      - vta-network

  syncservice:
    build:
      context: ./Backend
      dockerfile: SyncService/Dockerfile
    container_name: vta-syncservice
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=vta_dev;Username=vta_user;Password=vta_password
      - Secret__SecretKey=your-secret-key-change-this-in-production-minimum-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_assets:/app/Assets
    networks:
      - vta-network

  coturn:
    image: coturn/coturn:latest
    container_name: coturn-local
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turnserver.local.conf:/etc/coturn/turnserver.local.conf
    command: ["-c", "/etc/coturn/turnserver.local.conf"]
    networks:
      - vta-network

  # frontend:
  #   build:
  #     context: ./Frontend/vta_app
  #     dockerfile: Dockerfile
  #   container_name: vta-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - vta-network

networks:
  vta-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_assets:
    driver: local
