services:

  dbDummyCore:
    image: postgres:16
    container_name: dummy_core_postgres_offline
    restart: unless-stopped
    environment:
      POSTGRES_DB: dummy_core_offline
      POSTGRES_USER: dummy_core_user
      POSTGRES_PASSWORD: dummy_core_password
    ports:
      - "5433:5432"
    volumes:
      - dbDummyCore_data:/var/lib/postgresql/data
      - ./postgresql_dummy_core_schema.sql:/docker-entrypoint-initdb.d/postgresql_dummy_core_schema.sql:ro
    networks:
      - vta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dummy_core_user -d dummy_core_offline"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbVTA:
    image: postgres:16
    container_name: vta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vta_dev
      POSTGRES_USER: vta_user
      POSTGRES_PASSWORD: vta_password
    ports:
      - "5432:5432"
    volumes:
      - dbVTA_data:/var/lib/postgresql/data
      - ./postgresql_schema.sql:/docker-entrypoint-initdb.d/postgresql_schema.sql:ro
    networks:
      - vta-network
    depends_on:
       dbDummyCore:
        condition: service_healthy


networks:
  vta-network:
    driver: bridge

volumes:
  dbVTA_data:
    driver: local
  dbDummyCore_data:
    driver: local
