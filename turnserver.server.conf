# Domain configuration
realm=syncr.dev
server-name=turn.syncr.dev
fingerprint
message-integrity

# Network settings
listening-port=3478
listening-ip=0.0.0.0

# Use your Raspberry Pi's external/public IP here
external-ip=85.27.190.158/192.168.0.187
relay-ip=192.168.0.187

# Media relay ports
min-port=49160
max-port=49200

# Authentication
lt-cred-mech
user=turnuser:strongpassword  # Change this!

# TLS/DTLS for production (optional but recommended)
# Uncomment if you have SSL certificates
# tls-listening-port=5349
# cert=/path/to/cert.pem
# pkey=/path/to/key.pem
# no-tlsv1
# no-tlsv1_1

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Performance
bps-capacity=0