name: Continuous Integration and Deployment

on:
  pull_request:
    branches:
      - dev-main
      - main
  push:
    branches:
      - dev-main
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    env:
      TEST_CONNECTION_STRING: ${{ secrets.TEST_CONNECTION_STRING }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --framework net8.0 --verbosity normal

  flutter-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/vta_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  admin-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/admin-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + bundle)
        run: npm run build

  cd:
    runs-on: self-hosted
    needs: [backend-ci, flutter-ci, admin-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release

      - name: Publish the WebAPI
        run: dotnet publish --configuration Release --output ./output

      - name: Copy to deployment directory
        run: rsync -av --exclude='appsettings.json' --exclude='Assets/' ./output/ /var/www/VTA.API/

      - name: Set permissions for the assets folder
        run: sudo chmod 777 /var/www/VTA.API/Assets

      - name: Restart the service
        run: sudo systemctl restart vtaapi.service
