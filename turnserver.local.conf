# Basic settings for localhost testing
realm=localhost
server-name=localhost
fingerprint
message-integrity

# Network settings
listening-port=3478
min-port=49152
max-port=65535

# IP addresses for localhost
listening-ip=0.0.0.0
relay-ip=127.0.0.1
external-ip=127.0.0.1

# Simple authentication for testing
lt-cred-mech
user=testuser:testpass

# Logging
log-file=stdout
verbose

# Allow loopback for testing
no-multicast-peers
allow-loopback-peers

# Disable production features not needed for localhost
no-tls
no-dtls
no-cli